name: "ecommerce"
version: "1.0.0"
config-version: 2

profile: "ecommerce"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
        +schema: marts
      analytics:
        +materialized: table
        +schema: analytics

snapshots:
  ecommerce:
    +target_schema: snapshots

seeds:
  ecommerce:
    +schema: seeds
    dim_date_seed:
      +column_types:
        date_key: integer
