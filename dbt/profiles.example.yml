# Copy to ~/.dbt/profiles.yml (or mount it) and fill from your environment.
# Docker Compose supplies these via env; see docker/ and the Makefile.
ecommerce:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'warehouse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'warehouse') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'ecommerce') }}"
      schema: marts
      threads: 4
      keepalives_idle: 0
